<!doctype html><html lang="en"><meta charset="utf-8"><title>BCI bypass — v5</title><style>body{font:17px system-ui;background:#edf2f5;color:#20384a;margin:24px}main{max-width:1400px;margin:auto}h1{font-size:24px}video{display:block;width:100%;max-height:78vh;background:white;border-radius:10px}nav{display:flex;gap:14px;align-items:center;margin:16px 0}button,select{padding:10px;font:inherit}a{color:#087c58}#status{margin-left:auto}</style><main><h1>BCI bypass — v5 anatomy</h1><nav><select id="mode"><option value="motor">Motor BCI</option><option value="speech">Speech BCI</option></select><button id="toggle">Pause</button><button id="restart">Restart</button><span id="status"></span></nav><video id="v" src="motor-BCI.mp4" autoplay loop muted playsinline controls></video><p>Green pulses travel through the BCI decoder. Blue neural pulses still stop at the red marker.</p></main><script>const v=document.querySelector('#v'),toggle=document.querySelector('#toggle');document.querySelector('#mode').onchange=e=>{v.src=e.target.value+'-BCI.mp4';v.play()};toggle.onclick=()=>v.paused?v.play():v.pause();document.querySelector('#restart').onclick=()=>{v.currentTime=0;v.play()};v.ontimeupdate=()=>{document.querySelector('#status').textContent=(v.paused?'Paused':'Playing')+' · '+v.currentTime.toFixed(1)+' / 10.0 s';toggle.textContent=v.paused?'Play':'Pause'};</script></html>
